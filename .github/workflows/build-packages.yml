name: Build Packages

on:
  push:
    branches:
      - 'pkgs/**'
  pull_request:
    branches:
      - 'pkgs/**'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        branch: [tactical, system-tools, development-tools, documentation-tools, cloud-infrastructure, communication-media, data-processing]

    steps:
    - uses: actions/checkout@v5
      with:
        ref: pkgs/${{ matrix.branch }}

    - name: Install pixi
      uses: prefix-dev/setup-pixi@v0.9.2

    - name: Install meso-forge
      run: pixi global install meso-forge -c https://prefix.dev/meso-forge

    - name: Build packages
      run: pixi run build-all

    - name: Test packages
      run: pixi run test
